<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim do Aluno XX</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 10px;
            background-color: white;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 600px;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(87, 71, 71, 0.08);
        }

        th,
        td {
            border: 1px solid #bbb;
            padding: 10px;
            text-align: center;
        }

        thead th {
            background-color: #2f2f2f;
            color: #ffffff;
            font-weight: 700;
        }

        thead tr + tr th {
            background-color: #2f2f2f;
        }

        .area {
            width: 36px;
            font-weight: 700;
            background-color: #eee;
        }

        .disciplina {
            text-align: left;
            padding-left: 12px;
        }

        .media {
            text-align: left;
            background-color: #2f2f2f;
            color: #ffffff;
        }

        .nota_media {
            background-color: #2f2f2f;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>Boletim do Aluno XX</h1>

    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>

            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th class="area" rowspan="4" scope="rowgroup">Exatas</th>
                <td class="disciplina">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td class="disciplina">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td class="disciplina">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td class="disciplina">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th class="media" colspan="4" scope="row">Média de Exatas</th>
                <td class="nota_media">0.0</td>
            </tr>

            <tr>
                <th class="area" rowspan="2" scope="rowgroup">Humanas</th>
                <td class="disciplina">História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td class="disciplina">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th class="media" colspan="4" scope="row">Média de Humanas</th>
                <td class="nota_media">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
