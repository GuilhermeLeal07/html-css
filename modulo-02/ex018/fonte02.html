<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>

    <style>
        @font-face {
            font-family: 'Love';
            src: url('upheavtt.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /*
            Tipos de format():
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg
            */
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 3em;
            font-weight: normal;
        }

        h1 {
            font-family: 'Love', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Olá, Gui</h1>

    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit.
        Odit maiores ut sint non esse magnam cupiditate fugiat officia
        quibusdam adipisci, similique ex suscipit laudantium dignissimos
        culpa illo ea sit eligendi.
    </p>
</body>
</html>
