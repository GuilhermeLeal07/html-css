<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionando conteúdos</title>
</head>
<body>
    <h1>Conteúdos dentro de iframes</h1>

    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit.
        Suscipit quod quia rem beatae eos sunt, sint sit earum
        doloribus accusantium commodi corporis amet explicabo
        ut ducimus! Nihil in inventore repellat.
    </p>

    <h2>Vídeos</h2>

    <div style="padding: 56.25% 0 0 0; position: relative;">
        <iframe
            src="https://player.vimeo.com/video/1150530803?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479"
            frameborder="0"
            allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
            title="Street Race">
        </iframe>
    </div>

    <script src="https://player.vimeo.com/api/player.js"></script>

    <h2>Mapas do Google</h2>

    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7351.051656378147!2d-43.18330418362788!3d-22.893968260839863!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x997f5732a12a31%3A0x316901f971660ce1!2sMuseu%20do%20Amanh%C3%A3!5e0!3m2!1spt-BR!2sbr!4v1769631788499!5m2!1spt-BR!2sbr"
        width="600"
        height="450"
        style="border: 0;"
        allowfullscreen
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="Mapa do Museu do Amanhã">
    </iframe>

    <h2>Mapas do Waze</h2>

    <iframe
        src="https://embed.waze.com/iframe?zoom=16&amp;lat=-22.894020&amp;lon=-43.179350&amp;ct=livemap"
        width="600"
        height="450"
        allowfullscreen
        title="Mapa do Waze">
    </iframe>

    <h2>Google Documentos</h2>

    <iframe
        src="https://docs.google.com/document/d/e/2PACX-1vSilhchNH5o1VhlEyMcrzPVhNblo4Wd4pmu4GN_vYgNlBQZ-iD8zcU-sPhXOUVwzkdK9cPIUM-s0aSZ/pub?embedded=true"
        width="600"
        height="450"
        style="border: 0;"
        allowfullscreen
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="Google Documentos">
    </iframe>
</body>
</html>
